version: "3.9"

services:
  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGODB_URI: mongodb://mongo:27017/quizmaster
    depends_on:
      - redis
      - mongo

  redis:
    image: redis:7

  mongo:
    image: mongo:6
